<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa 321 - Concorra a Prêmios Incríveis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">RIFA <span>321</span></div>
            <button class="cart-icon">🛒</button>
        </header>

        <main>
            <div class="prize-image">
                <img id="prizeImage" src="" alt="Prêmio">
            </div>

            <div class="prize-info">
                <h1 id="prizeTitle">Carregando...</h1>
                <p class="subtitle" id="prizeSubtitle">Extração: Loteria Federal</p>
                <div class="ticket-price">
                    <span>Título</span>
                    <span class="price" id="ticketPrice">R$ 0,00</span>
                </div>
            </div>

            <div class="quantity-selector">
                <button class="qty-btn" data-qty="1">+01</button>
                <button class="qty-btn" data-qty="5">+05</button>
                <button class="qty-btn" data-qty="10">+10</button>
                <button class="qty-btn" data-qty="20">+20</button>
                <button class="qty-btn" data-qty="100">+100</button>
                <button class="qty-btn" data-qty="250">+250</button>
            </div>

            <div class="manual-selector">
                <button class="decrease">-</button>
                <input type="number" id="manualQty" value="1" min="1">
                <button class="increase">+</button>
            </div>

            <button class="participate-btn" id="participateBtn">
                Participar R$ <span id="totalPrice">0,00</span>
            </button>

            <div class="tabs">
                <button class="tab active" data-tab="winners">Títulos premiados</button>
                <button class="tab" data-tab="ranking">Ranking</button>
                <button class="tab" data-tab="prizes">Prêmios</button>
            </div>

            <div class="tab-content" id="winnersTab">
                <div class="winners-header">
                    <span>🎁 Títulos premiados (<span id="winnersCount">0</span>)</span>
                    <p>Ache um título abaixo e ganhe prêmios</p>
                </div>
                <div class="winners-list" id="winnersList"></div>
                <button class="roll-down">Role para baixo</button>
            </div>

            <div class="tab-content hidden" id="rankingTab">
                <p class="empty-state">Ranking em breve...</p>
            </div>

            <div class="tab-content hidden" id="prizesTab">
                <div class="prize-description" id="prizeDescription"></div>
            </div>

            <div class="regulations">
                <a href="regulamento.html" class="regulations-btn" style="display: block; text-decoration: none; text-align: center;">📋 Ver o regulamento</a>
            </div>
        </main>

        <footer>
            <a href="https://instagram.com" target="_blank" class="instagram-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
            </a>
            <p class="footer-text">Sistema feito com 🧡</p>
            <p class="footer-brand">RIFA <span>321</span></p>
            <p class="footer-terms">Termos e condições de uso para participante</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
