<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — GN Máfia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0808;
      --surface: #111010;
      --surface2: #181414;
      --text: #f5f1ec;
      --muted: #a69e94;
      --gold: #c9922a;
      --gold-light: #d5a651;
      --border: rgba(255,255,255,0.07);
      --red: #f55e5e;
      --green: #4caf50;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* LOGIN */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      width: min(400px, 100%);
      background: var(--surface);
      border: 1px solid rgba(213,166,81,0.25);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
    }
    .login-box img { height: 80px; object-fit: contain; margin-bottom: 16px; }
    .login-box h2 { font-family: 'Cinzel', serif; color: var(--gold-light); font-size: 1.2rem; margin-bottom: 6px; }
    .login-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 28px; }
    .login-box input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text); font-size: 0.95rem;
      margin-bottom: 14px;
    }
    .login-box input:focus { outline: none; border-color: rgba(213,166,81,0.5); }
    .btn-gold {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border: none; border-radius: 10px;
      color: #050404; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn-gold:hover { opacity: 0.88; }
    .login-error { color: var(--red); font-size: 0.82rem; margin-top: 10px; }

    /* ADMIN LAYOUT */
    .admin-wrap { display: none; min-height: 100vh; }
    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .admin-header-left { display: flex; align-items: center; gap: 14px; }
    .admin-header img { height: 48px; object-fit: contain; }
    .admin-header h1 { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold-light); letter-spacing: 0.1em; }
    .btn-logout {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--muted); padding: 8px 16px; border-radius: 8px;
      cursor: pointer; font-size: 0.82rem; transition: background 0.2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.1); }

    .admin-body { max-width: 1100px; margin: 0 auto; padding: 36px 24px; display: grid; gap: 32px; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 22px;
    }
    .stat-card .stat-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--gold-light); }
    .stat-card .stat-sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    /* SECTION TITLES */
    .section-title {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* CRIAR CUPOM */
    .create-form {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px;
      display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 14px; align-items: end;
    }
    .form-group { display: grid; gap: 7px; }
    .form-group label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; }
    .form-group input {
      padding: 11px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.9rem;
    }
    .form-group input:focus { outline: none; border-color: rgba(213,166,81,0.5); }
    .btn-create {
      padding: 11px 24px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border: none; border-radius: 8px;
      color: #050404; font-weight: 700; font-size: 0.88rem;
      cursor: pointer; white-space: nowrap; transition: opacity 0.2s;
      height: fit-content;
    }
    .btn-create:hover { opacity: 0.88; }

    /* TABELA CUPONS */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 12px 18px;
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }
    td { padding: 14px 18px; font-size: 0.88rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .tag-ativo { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3); color: var(--green); }
    .tag-esgotado { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; background: rgba(245,94,94,0.12); border: 1px solid rgba(245,94,94,0.3); color: var(--red); }
    .tag-inativo { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); }

    .progress-cell { min-width: 120px; }
    .progress-bar-wrap { height: 5px; background: rgba(255,255,255,0.07); border-radius: 999px; margin-top: 6px; }
    .progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); }

    .action-btns { display: flex; gap: 8px; }
    .btn-desativar {
      padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; border: 1px solid rgba(213,166,81,0.3);
      background: rgba(213,166,81,0.08); color: var(--gold-light); transition: background 0.2s;
    }
    .btn-desativar:hover { background: rgba(213,166,81,0.18); }
    .btn-deletar {
      padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; border: 1px solid rgba(245,94,94,0.3);
      background: rgba(245,94,94,0.08); color: var(--red); transition: background 0.2s;
    }
    .btn-deletar:hover { background: rgba(245,94,94,0.18); }
    .btn-ativar {
      padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; border: 1px solid rgba(76,175,80,0.3);
      background: rgba(76,175,80,0.08); color: var(--green); transition: background 0.2s;
    }
    .btn-ativar:hover { background: rgba(76,175,80,0.18); }

    /* TABELA CLIENTES */
    .clientes-table td:nth-child(2) { color: var(--muted); font-size: 0.82rem; }

    .toast-admin {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 12px 18px; border-radius: 10px;
      font-size: 0.88rem; z-index: 9999;
      animation: fadeInUp 0.3s ease;
    }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    .empty-row td { text-align: center; color: var(--muted); padding: 32px; }

    @media (max-width: 860px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .create-form { grid-template-columns: 1fr 1fr; }
      .admin-header { padding: 12px 16px; }
      .admin-body { padding: 20px 14px; }
    }
    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .create-form { grid-template-columns: 1fr; }
      table { font-size: 0.78rem; }
      th, td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <img src="logo.jpeg" alt="GN Máfia" />
      <h2>PAINEL ADMIN</h2>
      <p>Acesso restrito — GN Máfia</p>
      <input type="password" id="senhaInput" placeholder="Senha de acesso" />
      <button class="btn-gold" id="loginBtn">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="admin-wrap" id="adminWrap">
    <header class="admin-header">
      <div class="admin-header-left">
        <img src="logo.jpeg" alt="GN Máfia" />
        <h1>PAINEL ADMIN</h1>
      </div>
      <button class="btn-logout" id="logoutBtn">Sair</button>
    </header>

    <div class="admin-body">

      <!-- STATS -->
      <div>
        <div class="section-title">Visão Geral</div>
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card"><div class="stat-label">Total de Cupons</div><div class="stat-value" id="statTotal">—</div></div>
          <div class="stat-card"><div class="stat-label">Cupons Ativos</div><div class="stat-value" id="statAtivos">—</div></div>
          <div class="stat-card"><div class="stat-label">Usos Realizados</div><div class="stat-value" id="statUsos">—</div></div>
          <div class="stat-card"><div class="stat-label">Clientes Cadastrados</div><div class="stat-value" id="statClientes">—</div></div>
        </div>
      </div>

      <!-- CRIAR CUPOM -->
      <div>
        <div class="section-title">Criar Novo Cupom de Sorteio</div>
        <div class="create-form">
          <div class="form-group">
            <label>Código do cupom</label>
            <input type="text" id="newCodigo" placeholder="Ex: NATAL20" style="text-transform:uppercase" />
          </div>
          <div class="form-group">
            <label>Desconto (%)</label>
            <input type="number" id="newDesconto" placeholder="10" min="1" max="100" value="10" />
          </div>
          <div class="form-group">
            <label>Limite de usos</label>
            <input type="number" id="newLimite" placeholder="10" min="1" value="10" />
          </div>
          <button class="btn-create" id="criarBtn">Criar Cupom</button>
        </div>
      </div>

      <!-- CUPONS SORTEIO -->
      <div>
        <div class="section-title">Cupons de Sorteio</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Desconto</th>
                <th>Progresso</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="cuponsBody"></tbody>
          </table>
        </div>
      </div>

      <!-- CLIENTES -->
      <div>
        <div class="section-title">Clientes Cadastrados</div>
        <div class="table-wrap">
          <table class="clientes-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>WhatsApp</th>
                <th>Cupom Pessoal</th>
              </tr>
            </thead>
            <tbody id="clientesBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yhggzhyabuqjuxtetjpj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZ2d6aHlhYnVxanV4dGV0anBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTc4MzIsImV4cCI6MjA5NjMzMzgzMn0.jvF7q0tkjFOzYp1JOBG_2e2RbpZZ2euSKc1r4VHUnJs';
    const ADMIN_SENHA = 'gnmafia2025';

    function headers(extra = {}) {
      return { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', ...extra };
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast-admin';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; }, 2000);
      setTimeout(() => t.remove(), 2400);
    }

    // LOGIN
    function checkLogin() {
      return sessionStorage.getItem('gn_admin') === '1';
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const senha = document.getElementById('senhaInput').value;
      if (senha === ADMIN_SENHA) {
        sessionStorage.setItem('gn_admin', '1');
        document.getElementById('loginWrap').style.display = 'none';
        document.getElementById('adminWrap').style.display = 'block';
        loadAll();
      } else {
        document.getElementById('loginError').textContent = 'Senha incorreta.';
      }
    });

    document.getElementById('senhaInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('gn_admin');
      location.reload();
    });

    if (checkLogin()) {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('adminWrap').style.display = 'block';
      loadAll();
    }

    async function loadAll() {
      await Promise.all([loadCupons(), loadClientes()]);
    }

    async function loadCupons() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/cupons_sorteio?select=*&order=criado_em.desc`, { headers: headers() });
      const data = await res.json();
      renderCupons(data || []);
      renderStats(data || []);
    }

    async function loadClientes() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/dados_clientes?select=nome,email,whatsapp,cupom&order=id.desc`, { headers: headers() });
      const data = await res.json();
      renderClientes(data || []);
      document.getElementById('statClientes').textContent = (data || []).length;
    }

    function renderStats(cupons) {
      document.getElementById('statTotal').textContent = cupons.length;
      document.getElementById('statAtivos').textContent = cupons.filter(c => c.ativo && c.usados < c.limite).length;
      document.getElementById('statUsos').textContent = cupons.reduce((s, c) => s + c.usados, 0);
    }

    function renderCupons(cupons) {
      const tbody = document.getElementById('cuponsBody');
      if (!cupons.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Nenhum cupom criado ainda.</td></tr>';
        return;
      }
      tbody.innerHTML = cupons.map(c => {
        const esgotado = c.usados >= c.limite;
        const status = !c.ativo ? 'inativo' : esgotado ? 'esgotado' : 'ativo';
        const pct = Math.min((c.usados / c.limite) * 100, 100);
        return `
          <tr>
            <td><strong>${c.codigo}</strong></td>
            <td>${c.desconto_percent}% OFF</td>
            <td class="progress-cell">
              ${c.usados} / ${c.limite} usos
              <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
            </td>
            <td>
              ${status === 'ativo' ? '<span class="tag-ativo">ATIVO</span>' : ''}
              ${status === 'esgotado' ? '<span class="tag-esgotado">ESGOTADO</span>' : ''}
              ${status === 'inativo' ? '<span class="tag-inativo">INATIVO</span>' : ''}
            </td>
            <td>
              <div class="action-btns">
                ${c.ativo
                  ? `<button class="btn-desativar" onclick="toggleCupom('${c.id}', false)">Desativar</button>`
                  : `<button class="btn-ativar" onclick="toggleCupom('${c.id}', true)">Ativar</button>`
                }
                <button class="btn-deletar" onclick="deletarCupom('${c.id}', '${c.codigo}')">Excluir</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderClientes(clientes) {
      const tbody = document.getElementById('clientesBody');
      if (!clientes.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Nenhum cliente cadastrado ainda.</td></tr>';
        return;
      }
      tbody.innerHTML = clientes.map(c => `
        <tr>
          <td>${c.nome}</td>
          <td>${c.email}</td>
          <td>${c.whatsapp}</td>
          <td>${c.cupom ? `<strong style="color:var(--gold-light)">${c.cupom}</strong>` : '<span style="color:var(--muted)">—</span>'}</td>
        </tr>
      `).join('');
    }

    // CRIAR CUPOM
    document.getElementById('criarBtn').addEventListener('click', async () => {
      const codigo = document.getElementById('newCodigo').value.trim().toUpperCase();
      const desconto = parseInt(document.getElementById('newDesconto').value) || 10;
      const limite = parseInt(document.getElementById('newLimite').value) || 10;
      if (!codigo) { toast('Informe o código do cupom.'); return; }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/cupons_sorteio`, {
        method: 'POST',
        headers: headers({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify({ codigo, desconto_percent: desconto, limite, usados: 0, ativo: true })
      });
      if (res.ok || res.status === 201) {
        toast(`Cupom ${codigo} criado!`);
        document.getElementById('newCodigo').value = '';
        loadCupons();
      } else {
        const err = await res.json().catch(() => ({}));
        toast(err.message?.includes('unique') ? 'Código já existe.' : 'Erro ao criar cupom.');
      }
    });

    // TOGGLE ATIVO
    async function toggleCupom(id, ativo) {
      await fetch(`${SUPABASE_URL}/rest/v1/cupons_sorteio?id=eq.${id}`, {
        method: 'PATCH',
        headers: headers(),
        body: JSON.stringify({ ativo })
      });
      toast(ativo ? 'Cupom ativado.' : 'Cupom desativado.');
      loadCupons();
    }

    // DELETAR
    async function deletarCupom(id, codigo) {
      if (!confirm(`Excluir o cupom "${codigo}"? Esta ação não pode ser desfeita.`)) return;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/cupons_sorteio?id=eq.${id}`, {
        method: 'DELETE',
        headers: headers()
      });
      console.log('DELETE status:', res.status);
      if (res.ok || res.status === 204) {
        toast(`Cupom ${codigo} excluído.`);
        loadCupons();
      } else {
        const err = await res.json().catch(() => ({}));
        console.error('DELETE erro:', err);
        toast('Erro ao excluir. Veja o console.');
      }
    }

    // Realtime
    const ws = new WebSocket(`wss://yhggzhyabuqjuxtetjpj.supabase.co/realtime/v1/websocket?apikey=${SUPABASE_KEY}&vsn=1.0.0`);
    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({ topic: 'realtime:public:cupons_sorteio', event: 'phx_join', payload: {}, ref: '1' }));
    });
    ws.addEventListener('message', (e) => {
      const msg = JSON.parse(e.data);
      if (['UPDATE','INSERT','DELETE'].includes(msg.event)) loadCupons();
    });
  </script>
</body>
</html>
